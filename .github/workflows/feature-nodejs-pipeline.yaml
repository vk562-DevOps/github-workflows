name: feature-nodejs-pipeline
on:
  workflow_call: # this workflow will be called and used
    inputs:
      component:
        required: true
        type: string
      project:
        required: true
        type: string
      environment:
        required: true
        type: string
jobs:
  feature-nodejs-pipeline:
    runs-on: self-hosted
    steps:
      - name: Checkout # git checkout
        uses: actions/checkout@v7

      - name: install dependencies # install necessary dependencies
        run: npm install
